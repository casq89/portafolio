name: Deploy backend
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Subir código
        run: rsync -az --delete --exclude node_modules --exclude .env backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/backend/
      - name: Instalar y reiniciar
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /srv/backend && npm ci --omit=dev && sudo systemctl restart backend"